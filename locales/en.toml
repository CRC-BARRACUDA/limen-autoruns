# Every word this module puts on screen. The module card's own title and
# description are not here — the host reads those from limen.toml for English.

[ui]
title = "Autoruns"
idle_hint = "Scan this machine for programs configured to start automatically."
scan = "Scan"
refresh = "Refresh"
rows_hint = "Right-click a row for actions; double-click to open its details."
