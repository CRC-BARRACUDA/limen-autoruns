terms = "Слова"
terms_hint = "Кожне слово має трапитися десь у рядку — джерело, назва, команда, видавець чи розташування. Кожне звужує далі."
term_ph = "частина назви, шляху чи видавця…"

[filter.state]
valid = "Підписано й довірено"
unsigned = "Не підписано"
