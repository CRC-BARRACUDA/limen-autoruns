written = "Звіт записано"
failed = "Не вдалося створити звіт"

# Значення з реєстру, записане у файл і відкрите як текст: для ключа Run саме
# значення і є автозапуском, іншого скрипта для читання немає.
[value]
key = "Ключ"
name = "Значення"
source = "Джерело"
scope = "Область"

# Що містить кожна таблиця.
[family]
logon = "Вхід у систему"
explorer = "Провідник"
browser = "Internet Explorer"
boot = "Завантаження та відомі DLL"
hijack = "Перехоплення образів та AppInit"
lsa = "Постачальники LSA"
network = "Мережеві постачальники"
print = "Монітори друку"
office = "Надбудови Office та кодеки"
startup = "Теки автозавантаження"
scheduled = "За розкладом"
services = "Служби та драйвери"
other = "Інше"

# Чим підписано програму, на яку вказує запис.
[sig]
verified = "(Перевірено)"
not_verified = "(Не перевірено)"
missing = "Файл не знайдено"
