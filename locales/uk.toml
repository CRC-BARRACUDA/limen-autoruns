# Українська. Перший блок читає хост, а не модуль: [module] title та
# description — це те, що показує картка модуля та вкладка. Для англійської
# такого блоку немає: хост бере її з limen.toml.

[module]
title = "Локальні автозапуски"
description = "Показує програми, які запускаються самі на ЦЬОМУ комп'ютері — ключі Run і теки автозавантаження Windows, systemd, cron та autostart у Linux."

[ui]
title = "Автозапуски"
idle_hint = "Перевірити цей комп'ютер на програми, налаштовані запускатися самостійно."
scan = "Сканувати"
refresh = "Оновити"
rows_hint = "Правий клік по рядку — дії; подвійний клік — подробиці."
unsigned_count = "З них {n} запускають програму, яка не підписана або має недійсний підпис."
all = "Усе ({n})"
page = "Сторінка {page} з {pages} — показано {from}–{to} з {total}"
prev = "‹ Назад"
next = "Далі ›"
report = "Створити звіт"

[col]
source = "Джерело"
name = "Назва"
command = "Команда"
publisher = "Видавець"
scope = "Область"
enabled = "Увімкнено"
location = "Розташування"

[val]
yes = "так"
no = "ні"

[menu]
about = "Подробиці"
open_registry = "Відкрити в реєстрі"
open_path = "Відкрити теку"
open_script = "Відкрити скрипт"
reveal = "Показати у провіднику"
edit = "Відкрити в редакторі"
show_value = "Показати значення в редакторі"

[detail]
sig_kind = "Підпис"
catalog = "У каталозі Windows, не у самому файлі"
embedded = "У самому файлі"
title = "Автозапуск"
missing = "Цього запису немає в останньому скануванні — проскануйте ще раз."

[report]
config_title = "Створити звіт"
options = "Параметри звіту"
include = "Включити"
show = "Показати"
generate = "Створити"
content_both = "Таблиці та діаграми"
content_tables = "Лише таблиці"
content_charts = "Лише діаграми"
scope_all = "Усі записи"
scope_enabled = "Лише увімкнені"
scope_disabled = "Лише вимкнені"
title = "Звіт про автозапуски"
chart = "Записи за джерелом"
section = "Записи автозапуску"
total = "Усього записів: {n}"
enabled = "Увімкнено: {n}"
subtitle = "записів: {total} · увімкнено: {enabled}"
